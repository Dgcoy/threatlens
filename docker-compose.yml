# ThreatLens — UDM syslog → threat-intel detection platform
# Docker Compose stack (target state; images build as phases 1-4 land code)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-threatlens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatlens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tl]

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    restart: unless-stopped
    # UDM Pro remote syslog → host:514/udp → container:5514/udp
    ports:
      - "514:5514/udp"
    environment:
      SYSLOG_PORT: "5514"
      POSTGRES_USER: ${POSTGRES_USER:-threatlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-threatlens}
      POSTGRES_HOST: db
      IOC_REFRESH_SECONDS: "60"
      RETRO_SCAN_HOURS: "24"
    depends_on:
      db:
        condition: service_healthy
    networks: [tl]

  intel:
    build:
      context: .
      dockerfile: intel/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-threatlens}
      POSTGRES_HOST: db
      PULL_INTERVAL_MINUTES: "60"      # global sweep cadence (per-feed overrides)
      FEED_USER_AGENT: "ThreatLens/0.1"
      STIX_TAXII_TIMEOUT: "30"
    depends_on:
      db:
        condition: service_healthy
    networks: [tl]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-threatlens}
      POSTGRES_HOST: db
      APP_PIN: ${APP_PIN:?set in .env}          # PIN gate (house convention)
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [tl]

volumes:
  pgdata:

networks:
  tl:
