<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchman — Login</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>🛰️ Threat<span style="color:var(--accent)">Lens</span></h1>
    <p>UDM threat-intel dashboard</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autofocus>
    <div class="err" id="err"></div>
    <br>
    <button class="primary" style="width:100%" onclick="doLogin()">Unlock</button>
  </div>
</div>
<script src="/static/js/app.js"></script>
<script>
async function doLogin() {
  const pin = el("pin").value;
  el("err").textContent = "";
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({ pin }) });
    location.href = "/";
  } catch (e) {
    el("err").textContent = "Wrong PIN";
    el("pin").value = "";
    el("pin").focus();
  }
}
el("pin") && el("pin").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
